<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemBuddy - Learn</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>⚗️</text></svg>">
    <link rel="stylesheet" href="css/common.css?v=7">
    <link rel="stylesheet" href="css/app.css?v=8">
    <link rel="stylesheet" href="css/quiz.css?v=7">
    <link rel="stylesheet" href="css/leaderboard.css?v=8">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="top-nav-inner">
            <a href="#/home" class="nav-logo">
                <div class="nav-logo-icon">⚗️</div>
                ChemBuddy
            </a>

            <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu">☰</button>

            <div class="nav-links" id="nav-links">
                <a href="#/home" class="nav-link active">
                    <span class="nav-link-icon">🏠</span> Home
                </a>
                <a href="#/learn" class="nav-link">
                    <span class="nav-link-icon">📚</span> Learn
                </a>
                <a href="#/browse" class="nav-link">
                    <span class="nav-link-icon">🔍</span> Browse
                </a>
                <a href="#/quizzes" class="nav-link">
                    <span class="nav-link-icon">❓</span> Quizzes
                </a>
                <a href="#/leaderboard" class="nav-link">
                    <span class="nav-link-icon">🏆</span> Leaderboard
                </a>
                <a href="#/profile" class="nav-link">
                    <span class="nav-link-icon">👤</span> Profile
                </a>
            </div>

            <div class="nav-user">
                <span class="nav-user-name" id="nav-user-name"></span>
                <button class="nav-logout" id="nav-logout">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content (populated by router) -->
    <main class="app-content" id="app-content">
        <div class="cb-loading">
            <div class="cb-spinner"></div>
            <p>Loading...</p>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

    <!-- Config & Utilities -->
    <script src="js/firebase-config.js?v=8"></script>
    <script src="js/utils.js?v=8"></script>
    <script src="js/router.js?v=7"></script>

    <!-- Data -->
    <script src="data/categories.js?v=7"></script>
    <script src="data/equipment-db.js?v=14"></script>
    <script src="data/learning-path.js?v=10"></script>
    <script src="data/questions.js?v=13"></script>

    <!-- Modules -->
    <script src="js/equipment.js?v=14"></script>
    <script src="js/speech-text.js?v=1"></script>
    <script src="js/voice.js?v=9"></script>
    <script src="js/learn.js?v=10"></script>
    <script src="js/quiz-engine.js?v=9"></script>
    <script src="js/leaderboard.js?v=8"></script>
    <script src="js/certificate.js?v=1"></script>
    <script src="js/profile.js?v=8"></script>

    <!-- App Init -->
    <script>
    (function () {
        'use strict';

        initFirebase();

        // State
        var currentUser = null;
        var userProfile = null;
        var userProgress = null;

        // Auth guard
        auth.onAuthStateChanged(function (user) {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            if (ADMIN_EMAILS.includes(user.email)) {
                window.location.href = 'admin.html';
                return;
            }

            checkInvited(user).then(function (invited) {
                if (!invited) {
                    auth.signOut().then(function () { window.location.href = 'index.html#not-invited'; });
                    return;
                }
                startSession(user);
            });
        });

        function startSession(user) {
            currentUser = user;
            document.getElementById('nav-user-name').textContent = user.email.split('@')[0];

            // Update last active
            db.ref('users/' + user.uid + '/lastActiveAt').set(Date.now());

            // Track daily active
            var today = Utils.todayStr();
            db.ref('analytics/dailyActive/' + today + '/' + user.uid).set(true);

            // Load user profile and progress
            loadUserData(user.uid);
        }

        function startApp() {
            if (window.ChemBuddy.initialized) return;
            window.ChemBuddy.initialized = true;
            window.ChemBuddy.progress = window.ChemBuddy.progress || {};
            window.ChemBuddy.profile = window.ChemBuddy.profile || {};
            initRoutes();
            Router.init();
        }

        function loadUserData(uid) {
            window.ChemBuddy = window.ChemBuddy || {};
            window.ChemBuddy.user = currentUser;
            window.ChemBuddy.progress = {};
            window.ChemBuddy.profile = {};

            // Timeout fallback — start app even if DB reads fail
            var fallbackTimer = setTimeout(function () {
                console.warn('Firebase DB read timed out, starting app with defaults');
                startApp();
            }, 4000);

            // Load profile
            db.ref('users/' + uid).on('value', function (snap) {
                userProfile = snap.val() || {};
                document.getElementById('nav-user-name').textContent = userProfile.name || currentUser.email.split('@')[0];
                window.ChemBuddy.profile = userProfile;
                if (userProfile.name) {
                    syncLeaderboardName(uid, userProfile.name);
                } else {
                    askForName(uid);
                }
            }, function (err) {
                console.error('Profile read error:', err.message);
            });

            // Load progress
            db.ref('progress/' + uid).on('value', function (snap) {
                userProgress = snap.val() || {};
                window.ChemBuddy.progress = userProgress;

                clearTimeout(fallbackTimer);
                // Initialize router after first data load
                startApp();
            }, function (err) {
                console.error('Progress read error:', err.message);
                clearTimeout(fallbackTimer);
                startApp();
            });
        }

        // Keep the name on this student's leaderboard row in step with their
        // profile. Repairs rows written as "Student" before the name was saved.
        function syncLeaderboardName(uid, name) {
            var ref = db.ref('leaderboard/cumulative/' + uid);
            ref.once('value').then(function (snap) {
                var entry = snap.val();
                if (entry && entry.name !== name) {
                    ref.child('name').set(name);
                }
            });
        }

        // Accounts registered before the profile-save fix have no name.
        // Ask once; saving it updates the profile listener above, which then
        // repairs the leaderboard rows.
        var namePromptShown = false;
        function askForName(uid) {
            if (namePromptShown) return;
            namePromptShown = true;

            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem';
            overlay.innerHTML =
                '<form style="background:#fff;border-radius:12px;padding:1.5rem;max-width:360px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,0.2)">' +
                '<h3 style="margin:0 0 0.5rem">What is your name?</h3>' +
                '<p style="margin:0 0 1rem;color:#666;font-size:0.9rem">Your name will appear on the leaderboard.</p>' +
                '<input type="text" required maxlength="60" placeholder="Full name" style="width:100%;padding:0.7rem;border:1px solid #ccc;border-radius:8px;font-size:1rem;box-sizing:border-box">' +
                '<button type="submit" class="btn btn-primary" style="width:100%;margin-top:1rem">Save</button>' +
                '</form>';
            document.body.appendChild(overlay);

            var form = overlay.querySelector('form');
            var input = overlay.querySelector('input');
            input.focus();
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var name = input.value.trim();
                if (!name) return;
                form.querySelector('button').disabled = true;
                db.ref('users/' + uid).update({ name: name, email: currentUser.email })
                    .then(function () { overlay.remove(); })
                    .catch(function () {
                        form.querySelector('button').disabled = false;
                        Utils.toast('Could not save your name. Please try again.', 'error');
                    });
            });
        }

        function initRoutes() {
            Router.register('/home', renderHome);
            Router.register('/learn', Learn.renderOverview);
            Router.register('/learn/:equipId', Learn.renderLesson);
            Router.register('/browse', Equipment.renderBrowse);
            Router.register('/browse/:equipId', Equipment.renderBrowseEquip);
            Router.register('/quizzes', QuizEngine.renderQuizList);
            Router.register('/quiz/:quizId', QuizEngine.renderQuiz);
            Router.register('/quiz/:quizId/practice', QuizEngine.renderPractice);
            Router.register('/leaderboard', Leaderboard.render);
            Router.register('/profile', Profile.render);
        }

        // Home page render
        function renderHome(container) {
            var uid = currentUser.uid;
            var profile = window.ChemBuddy.profile || {};
            var progress = window.ChemBuddy.progress || {};
            var name = profile.name || 'Student';

            // Next equipment on the learning path
            var todayInfo = Learn.getTodayInfo(progress);
            var totalPoints = calculateTotalPoints(progress);
            var studiedCount = Object.keys(progress.studied || {}).length;
            var quizzesDone = Object.keys(progress.quizzes || {}).length;
            var streak = getStudyStreak(progress);

            var html = '<div class="home-welcome">';
            html += '<h1>Welcome back, ' + Utils.sanitize(name) + '!</h1>';
            html += '<p>Continue your chemical engineering equipment journey</p>';
            html += '</div>';

            html += '<div class="home-grid">';
            html += '<div class="home-main">';

            // Today's task card
            if (todayInfo && todayInfo.upcoming) {
                html += '<div class="today-card">';
                html += '<h3>✅ You are up to date</h3>';
                html += '<h2>Next: ' + Utils.sanitize(todayInfo.title) + '</h2>';
                html += '<p class="today-card-meta">Opens on ' + Utils.sanitize(todayInfo.opensOn) + ' — ' + Utils.sanitize(todayInfo.moduleTitle) + '</p>';
                html += '<div class="flex gap-1"><a href="#/quizzes" class="btn">Practise a Quiz</a></div>';
                html += '</div>';
            } else if (todayInfo) {
                html += '<div class="today-card">';
                html += '<h3>📘 ' + Utils.sanitize(todayInfo.moduleTitle) + '</h3>';
                html += '<h2>' + Utils.sanitize(todayInfo.title) + '</h2>';
                html += '<p class="today-card-meta">Equipment ' + todayInfo.position + ' in this module</p>';
                html += '<div class="flex gap-1">';
                html += '<a href="#/learn/' + todayInfo.equipId + '" class="btn">Continue Learning →</a>';
                if (todayInfo.quizAvailable) {
                    html += '<a href="#/quiz/' + todayInfo.equipId + '" class="btn">Take Quiz</a>';
                }
                html += '</div></div>';
            } else if (Certificate.isEligible(progress)) {
                html += '<div class="today-card">';
                html += '<h3>🎓 Level 1 Complete!</h3>';
                html += '<h2>Your certificate is ready</h2>';
                html += '<a href="#/profile" class="btn">Get Your Certificate →</a>';
                html += '</div>';
            } else {
                html += '<div class="today-card">';
                html += '<h3>🎉 Great Progress!</h3>';
                html += '<h2>Keep exploring equipment</h2>';
                html += '<a href="#/learn" class="btn">View Learning Path →</a>';
                html += '</div>';
            }

            // Stats
            html += '<div class="stat-grid">';
            html += '<div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-value">' + totalPoints + '</div><div class="stat-label">Points</div></div>';
            html += '<div class="stat-card"><div class="stat-icon">📖</div><div class="stat-value">' + studiedCount + '</div><div class="stat-label">Equipment Studied</div></div>';
            html += '<div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value">' + quizzesDone + '</div><div class="stat-label">Quizzes Done</div></div>';
            html += '<div class="stat-card"><div class="stat-icon">🔥</div><div class="stat-value">' + streak + '</div><div class="stat-label">Day Streak</div></div>';
            html += '</div>';

            html += '</div>'; // home-main

            // Sidebar
            html += '<div class="home-side">';

            // Motivation messages
            var messages = getMotivationMessages(progress, streak, totalPoints);
            messages.forEach(function (msg) {
                html += '<div class="motivation-card"><p>' + msg + '</p></div>';
            });

            // Quick links
            html += '<div class="card"><div class="card-body">';
            html += '<h3 class="mb-2">Quick Links</h3>';
            html += '<div class="flex flex-col gap-1">';
            html += '<a href="#/browse" class="btn btn-outline btn-block">Browse All ' + Object.keys(equipmentDB).length + ' Equipment</a>';
            html += '<a href="#/leaderboard" class="btn btn-outline btn-block">View Leaderboard</a>';
            html += '</div></div></div>';

            html += '</div>'; // home-side
            html += '</div>'; // home-grid

            container.innerHTML = html;
        }

        function calculateTotalPoints(progress) {
            var total = 0;
            var studied = progress.studied || {};
            total += Object.keys(studied).length * 5;
            var quizzes = progress.quizzes || {};
            for (var k in quizzes) { total += (quizzes[k].points || 0); }
            return total;
        }

        function getStudyStreak(progress) {
            var dates = new Set();
            var studied = progress.studied || {};
            for (var k in studied) {
                if (studied[k].completedAt) dates.add(new Date(studied[k].completedAt).toISOString().slice(0, 10));
            }
            var quizzes = progress.quizzes || {};
            for (var k in quizzes) {
                if (quizzes[k].completedAt) dates.add(new Date(quizzes[k].completedAt).toISOString().slice(0, 10));
            }
            return Utils.calculateStreak(Array.from(dates));
        }

        function getMotivationMessages(progress, streak, points) {
            var msgs = [];
            if (streak >= 3) msgs.push('<span class="motivation-icon">🔥</span> You\'re on a ' + streak + '-day streak! Keep it up!');
            if (streak === 0) msgs.push('<span class="motivation-icon">💪</span> Start your streak today — study or take a quiz!');

            var quizzesDone = Object.keys(progress.quizzes || {}).length;
            if (quizzesDone === 0) msgs.push('<span class="motivation-icon">📝</span> Take your first quiz after studying the equipment!');

            var todayInfo = Learn.getTodayInfo(progress);
            if (todayInfo && todayInfo.quizAvailable) {
                msgs.push('<span class="motivation-icon">🎯</span> The ' + Utils.sanitize(todayInfo.title) + ' quiz is ready — are you?');
            }

            if (msgs.length === 0) msgs.push('<span class="motivation-icon">🌟</span> Great progress! Keep learning every day.');
            return msgs;
        }

        // Expose for other modules
        window.ChemBuddy = window.ChemBuddy || {};
        window.ChemBuddy.calculateTotalPoints = calculateTotalPoints;
        window.ChemBuddy.getStudyStreak = getStudyStreak;

        // Logout
        document.getElementById('nav-logout').addEventListener('click', function () {
            auth.signOut().then(function () {
                window.location.href = 'index.html';
            });
        });

        // Hamburger menu
        document.getElementById('nav-hamburger').addEventListener('click', function () {
            document.getElementById('nav-links').classList.toggle('open');
        });

        // Close mobile menu on nav click
        document.querySelectorAll('.nav-link').forEach(function (link) {
            link.addEventListener('click', function () {
                document.getElementById('nav-links').classList.remove('open');
            });
        });
    })();
    </script>
</body>
</html>
