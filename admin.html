<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemBuddy - Admin Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="images/brand/chembuddy-icon-tile.svg">
    <link rel="apple-touch-icon" href="images/brand/chembuddy-logo-icon-white.png">
    <link rel="stylesheet" href="css/common.css?v=7">
    <link rel="stylesheet" href="css/admin.css?v=8">
</head>
<body>
    <!-- Admin Nav -->
    <nav class="admin-nav">
        <a href="admin.html" class="nav-logo">
            <img class="nav-logo-img" src="images/brand/chembuddy-icon-tile.svg" alt="" width="32" height="32">
            <span class="brand-word"><span class="brand-chem">Chem</span><span class="brand-buddy">Buddy</span> Admin</span>

            <button class="admin-nav-link active" data-tab="overview">Overview</button>

            <button class="admin-nav-link" data-tab="quizzes">Quizzes</button>

        </div>
        <button class="admin-logout" id="admin-logout">Logout</button>
    </nav>

    <main class="admin-content" id="admin-content">
        <div class="cb-loading"><div class="cb-spinner"></div><p>Loading dashboard...</p></div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
